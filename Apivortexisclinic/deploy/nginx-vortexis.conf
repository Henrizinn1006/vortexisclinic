# /etc/nginx/sites-available/vortexis
# Troque app.SEUDOMINIO.com.br pelo seu domínio. O certbot acrescenta o
# bloco HTTPS sozinho (passo 6 do deploy-vps.md).
server {
    listen 80;
    server_name app.SEUDOMINIO.com.br;

    # Painel (estático)
    root /srv/vortexis/Appvortexisclinic;
    index index.html;

    client_max_body_size 10m;   # upload de documento (limite da API: 8 MB)

    # API: mesma origem do painel, então não há CORS.
    location ~ ^/(auth|session|workspace|workspaces|billing|health|professions|invitations)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # O service worker precisa ser revalidado sempre, ou o painel
    # novo demora a chegar no navegador.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nada de .env, .git ou testes servidos por engano.
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /tests/ { deny all; }
    location ^~ /docs/ { deny all; }
}
